<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KICKGHOST ($AKSG) - Rewards Hub</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    <script src="https://unpkg.com/@thirdweb-dev/sdk@latest/dist/thirdweb-sdk.browser.js"></script>

    <style>
        :root {
            --primary-color: #a336ff; 
            --accent-color: #00ffa3;  
            --bg-dark: #020202;
            --card-bg: #111111;
            --kick-green: #00e701;
            --warning-red: #ff4d4d;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            background-color: var(--bg-dark); 
            color: white; margin: 0; padding: 0; 
            line-height: 1.6;
        }

        .container { max-width: 1100px; margin: 0 auto; padding: 20px; }
        header { text-align: center; padding: 30px 0; }
        .logo-main { width: 120px; border-radius: 50%; border: 3px solid var(--primary-color); box-shadow: 0 0 20px var(--primary-color); }
        
        .section { 
            background: var(--card-bg); padding: 25px; border-radius: 20px; 
            border: 1px solid #222; margin-bottom: 25px; position: relative;
        }

        .dashboard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 25px; }
        @media (max-width: 850px) { .dashboard-grid { grid-template-columns: 1fr; } }

        /* Buttons */
        .btn-web3 { 
            background: linear-gradient(90deg, var(--primary-color), #7a1fd1);
            color: white; border: none; padding: 15px; width: 100%; border-radius: 12px;
            font-weight: bold; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .btn-web3:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(163, 54, 255, 0.4); }
        .btn-outline { background: transparent; border: 2px solid var(--accent-color); color: var(--accent-color); margin-top: 10px; }

        /* Wallet Modal */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); z-index: 1000; justify-content: center; align-items: center; backdrop-filter: blur(5px);
        }
        .modal-content {
            background: #1a1a1a; padding: 30px; border-radius: 20px; border: 1px solid var(--primary-color);
            width: 90%; max-width: 400px; text-align: center;
        }
        .wallet-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .wallet-option {
            background: #000; border: 1px solid #333; border-radius: 12px; padding: 15px; cursor: pointer;
            display: flex; flex-direction: column; align-items: center; gap: 10px; transition: 0.3s;
        }
        .wallet-option:hover { border-color: var(--accent-color); background: #050505; }

        /* Mystery Boxes */
        .mystery-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin: 15px 0; }
        .mystery-box { 
            background: #1a1a1a; border: 2px solid #333; border-radius: 10px; aspect-ratio: 1;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
        }
        .mystery-box:hover { border-color: var(--accent-color); color: var(--accent-color); }

        .lang-split { display: flex; justify-content: space-between; font-size: 0.8rem; color: #888; margin-bottom: 10px; }
        .token-info { background: #050505; padding: 10px; border-radius: 10px; font-family: monospace; font-size: 0.8rem; word-break: break-all; color: #aaa; border: 1px dashed #333; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <img src="https://i.ibb.co/cKQrJBW1/7a2c60c6adc0c73f125c86674fddbc42.jpg" alt="Logo" class="logo-main">
        <h1>KICKGHOST ($AKSG)</h1>
        <p style="color: var(--accent-color)">المنصة الرسمية للمكافآت | Official Rewards Hub</p>
        
        <div style="margin-top: 15px;">
            <a href="https://x.com/tv_ghostgaming" target="_blank" style="color:white; font-size: 1.5rem; margin: 0 10px;"><i class="fab fa-x-twitter"></i></a>
            <a href="https://www.instagram.com/ghost.gamingtv" target="_blank" style="color:white; font-size: 1.5rem; margin: 0 10px;"><i class="fab fa-instagram"></i></a>
        </div>
    </header>

    <div class="dashboard-grid">
        <div class="section">
            <div class="lang-split">
                <span><i class="fas fa-chart-line"></i> الشارت المباشر</span>
                <span>Live Chart</span>
            </div>
            <div style="text-align: center; margin-bottom: 10px;">
                <img src="https://raw.githubusercontent.com/ghostgamingtv0/kickghostofficial/main/geckoterminal_light.png" alt="GeckoTerminal" style="height: 30px;">
            </div>
            <div style="height: 450px; border-radius: 15px; overflow: hidden; border: 1px solid #333;">
                <iframe src="https://www.geckoterminal.com/polygon_pos/pools/0xa5a77ff6e6fd415a33b9dfc10a5a3e38e1ef4249?embed=1&info=0&swaps=0&light_chart=0&chart_type=price&resolution=1d&bg_color=111827" 
                style="width: 100%; height: 100%; border: none;"></iframe>
            </div>
        </div>

        <div class="section">
            <div class="lang-split">
                <span><i class="fas fa-wallet"></i> المحفظة والمكافآت</span>
                <span>Wallet & Rewards</span>
            </div>
            
            <button class="btn-web3" id="connectWalletBtn">
                <i class="fas fa-plug"></i> ربط المحفظة | Connect Wallet
            </button>

            <div id="walletConnectedArea" style="display:none; margin-top: 20px;">
                <div class="token-info" id="userAddress">0x...</div>
                <button class="btn-web3 btn-outline" onclick="addAKSGToken()">
                    <i class="fas fa-plus"></i> إضافة $AKSG للمحفظة
                </button>
            </div>

            <hr style="border: 0; border-top: 1px solid #222; margin: 25px 0;">

            <h3>🎁 صناديق أسبوعية | Weekly Boxes</h3>
            <div class="mystery-grid">
                <div class="mystery-box"><i class="fas fa-box"></i></div>
                <div class="mystery-box"><i class="fas fa-box"></i></div>
                <div class="mystery-box"><i class="fas fa-box"></i></div>
                <div class="mystery-box"><i class="fas fa-box"></i></div>
                <div class="mystery-box"><i class="fas fa-box"></i></div>
            </div>
            <p style="font-size: 0.8rem; color: #666; text-align: center;">العقد: 0x58F821f9...2a4D</p>
        </div>
    </div>

    <footer style="text-align: center; padding: 40px; opacity: 0.5; font-size: 0.8rem;">
        <img src="https://i.ibb.co/cKQrJBW1/7a2c60c6adc0c73f125c86674fddbc42.jpg" width="40" style="border-radius: 50%; margin-bottom: 10px;"><br>
        © 2026 KICKGHOST | Ghost Gaming TV Ecosystem
    </footer>
</div>

<div id="walletModal" class="modal-overlay">
    <div class="modal-content">
        <h3>اختر المحفظة | Select Wallet</h3>
        <div class="wallet-grid">
            <div class="wallet-option" onclick="connectWallet('metamask')">
                <img src="https://upload.wikimedia.org/wikipedia/commons/3/36/MetaMask_Logo.svg" width="40">
                <span>MetaMask</span>
            </div>
            <div class="wallet-option" onclick="connectWallet('trust')">
                <img src="https://trustwallet.com/assets/images/media/assets/trust_wallet_logo.svg" width="40">
                <span>Trust Wallet</span>
            </div>
        </div>
        <button onclick="closeModal()" style="background:none; border:none; color:#888; margin-top:20px; cursor:pointer; text-decoration:underline;">إغلاق</button>
    </div>
</div>

<script>
    const TOKEN_CONFIG = {
        address: '0x58F821f9bDa7Af97c76725A1aBACD3EC61042a4D',
        symbol: 'AKSG',
        decimals: 18,
        image: 'https://i.ibb.co/cKQrJBW1/7a2c60c6adc0c73f125c86674fddbc42.jpg'
    };

    const modal = document.getElementById('walletModal');
    const connectBtn = document.getElementById('connectWalletBtn');

    connectBtn.onclick = () => modal.style.display = 'flex';
    function closeModal() { modal.style.display = 'none'; }

    async function connectWallet(type) {
        if (window.ethereum) {
            try {
                const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                const address = accounts[0];
                
                document.getElementById('userAddress').innerText = address;
                document.getElementById('walletConnectedArea').style.display = 'block';
                connectBtn.innerHTML = '<i class="fas fa-check-circle"></i> تم الربط | Connected';
                connectBtn.style.background = 'var(--kick-green)';
                closeModal();

                // عرض طلب إضافة العملة تلقائياً عند أول ربط
                addAKSGToken();
                
            } catch (err) {
                console.error("User rejected");
            }
        } else {
            alert("يرجى تثبيت MetaMask أو Trust Wallet");
        }
    }

    async function addAKSGToken() {
        if (!window.ethereum) return;
        try {
            await window.ethereum.request({
                method: 'wallet_watchAsset',
                params: {
                    type: 'ERC20',
                    options: TOKEN_CONFIG,
                },
            });
        } catch (error) {
            console.log("Error adding token:", error);
        }
    }

    // إغلاق المودال عند الضغط خارجه
    window.onclick = (event) => {
        if (event.target == modal) closeModal();
    }
</script>

</body>
</html>
