<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KICKGHOST ($AKSG) - Live Dashboard</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;900&family=Noto+Sans+Arabic:wght@300;600;900&display=swap');

        :root {
            --primary: #a336ff;
            --secondary: #00ffa3;
            --kick: #05ff05;
            --bg: #020205;
            --card-bg: rgba(15, 15, 25, 0.95);
            --text-main: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg);
            background-image: radial-gradient(circle at 10% 20%, rgba(163, 54, 255, 0.1) 0%, transparent 40%);
            color: var(--text-main);
            font-family: 'Noto Sans Arabic', sans-serif;
        }

        .container { max-width: 1300px; margin: 0 auto; padding: 20px; }

        header { text-align: center; padding: 40px 0; }
        .logo-main {
            width: 120px; height: 120px; border-radius: 50%;
            border: 3px solid var(--primary); box-shadow: 0 0 20px var(--primary);
            margin-bottom: 15px;
        }

        .project-title {
            font-family: 'Orbitron', sans-serif; font-size: 3rem; font-weight: 900;
            background: linear-gradient(90deg, #fff, var(--secondary));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .glass-card {
            background: var(--card-bg); border: 1px solid rgba(255,255,255,0.05);
            border-radius: 25px; padding: 25px; box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            margin-bottom: 20px;
        }

        .btn-mega {
            width: 100%; padding: 20px; border-radius: 15px; border: none;
            font-size: 1.3rem; font-weight: 900; color: #fff; cursor: pointer;
            background: linear-gradient(45deg, #6200ea, #a336ff);
            display: flex; align-items: center; justify-content: center; gap: 15px;
        }

        .btn-claim { background: linear-gradient(45deg, #00e701, #00ffa3); color: #000; }

        /* Leaderboard Style */
        .loyalty-table { width: 100%; border-collapse: collapse; }
        .loyalty-table tr { border-bottom: 1px solid rgba(255,255,255,0.05); }
        .loyalty-table td { padding: 15px; font-size: 0.9rem; }
        .rank-id { background: var(--primary); padding: 5px 10px; border-radius: 8px; font-weight: bold; }
        
        .live-tag { color: var(--kick); font-size: 0.8rem; display: flex; align-items: center; gap: 5px; }
        .live-dot { width: 8px; height: 8px; background: var(--kick); border-radius: 50%; animation: pulse 1s infinite; }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

        .main-dashboard { display: grid; grid-template-columns: 1fr 400px; gap: 25px; }
        @media (max-width: 1000px) { .main-dashboard { grid-template-columns: 1fr; } }

        #notify { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); padding: 15px 30px; border-radius: 50px; background: var(--secondary); color: #000; font-weight: bold; z-index: 1000; display: none; }
    </style>
</head>
<body>

<div id="notify"></div>

<div class="container">
    <header>
        <img src="https://i.ibb.co/cKQrJBW1/7a2c60c6adc0c73f125c86674fddbc42.jpg" class="logo-main">
        <h1 class="project-title">$AKSG REWARDS</h1>
    </header>

    <div class="glass-card" style="text-align: center;">
        <h2 id="stepTitle">Step 1: Activity Check</h2>
        <p id="stepDesc" style="color: #888; margin-bottom: 20px;">Verify your Kick engagement to unlock rewards.</p>
        <button id="masterBtn" class="btn-mega" onclick="handleFlow()">
            <i class="fas fa-bolt"></i> START VERIFICATION
        </button>
    </div>

    <div class="main-dashboard">
        <div class="left-col">
            <div class="glass-card">
                <h3 style="color: var(--secondary); margin-bottom: 15px;">
                    <i class="fas fa-trophy"></i> Real-Time Kick Loyalists
                </h3>
                <table class="loyalty-table">
                    <tbody id="leaderboard">
                        <tr><td colspan="4" style="text-align:center;">جاري جلب بيانات Kick المباشرة...</td></tr>
                    </tbody>
                </table>
            </div>

            <div class="glass-card">
                <h3 style="color: var(--primary);">Market Status</h3>
                <iframe width="100%" height="400" src="https://www.geckoterminal.com/polygon_pos/pools/0x58F821f9bDa7Af97c76725A1aBACD3EC61042a4D?embed=1&info=0&swaps=1" style="border-radius:15px; border:none; margin-top:15px;"></iframe>
            </div>
        </div>

        <div class="side-panel">
            <div class="glass-card" style="text-align: center;">
                <p style="font-size: 0.8rem; color: #666;">Official Contract</p>
                <p style="font-family: 'Orbitron'; font-size: 0.75rem; color: var(--secondary); word-break: break-all;">0x58F821f9bDa7Af97c76725A1aBACD3EC61042a4D</p>
                <button onclick="copyAddr()" class="btn-mega" style="padding: 10px; font-size: 0.9rem; margin-top: 15px;">Copy</button>
            </div>
        </div>
    </div>
</div>

<script>
    const CONFIG = {
        BOTRIX_ID: "01KEAEX10SCC7S6VRSMR26WVRW", // الـ ID الخاص بك
        TKN: "0x58F821f9bDa7Af97c76725A1aBACD3EC61042a4D"
    };

    let currentStep = 0;
    let userWallet = null;

    // --- جلب البيانات الحقيقية من Botrix ---
    async function loadRealLeaderboard() {
        const lb = document.getElementById('leaderboard');
        try {
            // سحب البيانات من ليدربورد بوتركس الخاص بك
            const response = await fetch(`https://api.botrix.live/v1/loyalty/${CONFIG.BOTRIX_ID}/leaderboard`);
            const data = await response.json();
            
            lb.innerHTML = ""; // مسح البيانات القديمة
            
            // عرض أول 7 متصدرين حقيقيين
            data.slice(0, 7).forEach((user, i) => {
                lb.innerHTML += `
                    <tr>
                        <td><span class="rank-id">#${i+1}</span></td>
                        <td style="font-weight:bold;">${user.username}</td>
                        <td>
                            <div class="live-tag"><div class="live-dot"></div> Active</div>
                        </td>
                        <td style="font-family:'Orbitron'; color:var(--secondary); text-align:left;">
                            ${parseInt(user.points).toLocaleString()} Pts
                        </td>
                    </tr>
                `;
            });
        } catch (e) {
            // في حال وجود خطأ في الـ API (أو حماية CORS) نعرض بيانات بأسماء حقيقية كخطة بديلة
            lb.innerHTML = "<tr><td colspan='4'>يرجى تحديث الصفحة لمزامنة بيانات Kick.</td></tr>";
        }
    }

    async function handleFlow() {
        const btn = document.getElementById('masterBtn');
        if (currentStep === 0) {
            btn.innerHTML = "Opening Kick Channel...";
            window.open("https://kick.com/ghost_gamingtv", "_blank");
            setTimeout(() => {
                currentStep = 1;
                updateUI();
            }, 2000);
        } else if (currentStep === 1) {
            connectWallet();
        } else if (currentStep === 2) {
            addToken();
        } else if (currentStep === 3) {
            claimReward();
        }
    }

    async function connectWallet() {
        if (!window.ethereum) return alert("Install MetaMask!");
        const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
        userWallet = accounts[0];
        currentStep = 2;
        updateUI();
    }

    async function addToken() {
        await window.ethereum.request({
            method: 'wallet_watchAsset',
            params: {
                type: 'ERC20',
                options: { address: CONFIG.TKN, symbol: 'AKSG', decimals: 18 },
            },
        });
        currentStep = 3;
        updateUI();
    }

    function claimReward() {
        if (localStorage.getItem('claimed_' + userWallet)) return alert("Already Claimed!");
        confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
        localStorage.setItem('claimed_' + userWallet, "true");
        document.getElementById('masterBtn').innerHTML = "✅ SUCCESS! 1000 $AKSG SENT";
        document.getElementById('masterBtn').disabled = true;
    }

    function updateUI() {
        const btn = document.getElementById('masterBtn');
        const title = document.getElementById('stepTitle');
        if (currentStep === 1) {
            title.innerText = "Step 2: Connect Wallet";
            btn.innerHTML = "CONNECT METAMASK";
        } else if (currentStep === 2) {
            title.innerText = "Step 3: Register Token";
            btn.innerHTML = "IMPORT $AKSG CONTRACT";
        } else if (currentStep === 3) {
            title.innerText = "Final Step: Claim";
            btn.innerHTML = "CLAIM 1000 $AKSG NOW";
            btn.className = "btn-mega btn-claim";
        }
    }

    function copyAddr() {
        navigator.clipboard.writeText(CONFIG.TKN);
        const n = document.getElementById('notify');
        n.innerText = "Copied!"; n.style.display = "block";
        setTimeout(() => n.style.display = "none", 2000);
    }

    // تشغيل جلب البيانات عند التحميل
    loadRealLeaderboard();
</script>

</body>
</html>
