<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KICKGHOST ($AKSG) - Rewards Hub</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@thirdweb-dev/sdk@3.10.59/dist/thirdweb-sdk.browser.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root { --p: #a336ff; --a: #00ffa3; --bg: #020202; --c: #111111; --k: #00e701; }
        body { font-family: sans-serif; background: var(--bg); color: white; margin: 0; text-align: center; }
        .container { max-width: 850px; margin: auto; padding: 20px; }
        .section { background: var(--c); padding: 25px; border-radius: 20px; border: 1px solid #333; margin-bottom: 20px; }
        .btn-web3 { 
            background: linear-gradient(90deg, var(--p), #7a1fd1); color: white; border: none; 
            padding: 18px; width: 100%; border-radius: 12px; font-weight: bold; cursor: pointer; 
            display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 15px;
        }
        .btn-kick { background: var(--k); color: black; }
        .promo-input { 
            width: 100%; padding: 18px; border-radius: 12px; border: 2px solid var(--p); 
            background: #000; color: var(--a); text-align: center; font-size: 1.2rem; box-sizing: border-box;
        }
        #chart-container { width: 100%; height: 600px; border-radius: 20px; overflow: hidden; margin-top: 20px; }
        #confirmStep, #walletStep, #registrationStep { display: none; }
        .socials a { color: white; font-size: 2rem; margin: 0 15px; }
    </style>
</head>
<body>

<div class="container">
    <header style="padding: 20px;">
        <img src="https://i.ibb.co/cKQrJBW1/7a2c60c6adc0c73f125c86674fddbc42.jpg" style="width:100px; border-radius:50%; border:2px solid var(--p);">
        <h1>KICKGHOST ($AKSG)</h1>
        <p>Official Rewards Hub | مركز المكافآت</p>
    </header>

    <div class="section">
        <h4 style="color:var(--a);">Add Token | إضافة العملة</h4>
        <button class="btn-web3" style="background:#222; border:1px solid var(--a);" id="addToken">
            <i class="fas fa-plus"></i> Add $AKSG to Wallet Automatically
        </button>
    </div>

    <div class="section">
        <div id="kickStep">
            <button class="btn-web3 btn-kick" id="btnKick">1. Follow on Kick | متابعة</button>
        </div>

        <div id="confirmStep">
            <button class="btn-web3" id="btnConfirm">2. I Followed ✅ لقد تابعت</button>
        </div>

        <div id="walletStep">
            <button class="btn-web3" id="btnConnect">3. Connect Wallet | ربط المحفظة</button>
        </div>

        <div id="registrationStep">
            <input type="text" id="promoCode" class="promo-input" placeholder="Enter Promo Code | أدخل الكود">
            <button class="btn-web3" id="btnClaim">Claim $AKSG | استلم المكافأة</button>
        </div>
    </div>

    <div class="section">
        <div class="socials">
            <a href="https://kick.com/ghost_gamingtv" target="_blank"><i class="fab fa-kickstarter"></i></a>
            <a href="https://x.com/tv_ghostgaming" target="_blank"><i class="fab fa-twitter"></i></a>
            <a href="https://www.instagram.com/ghost.gamingtv" target="_blank"><i class="fab fa-instagram"></i></a>
        </div>
    </div>

    <div id="chart-container">
        <iframe src="https://dexscreener.com/polygon/0x58F821f9bDa7Af97c76725A1aBACD3EC61042a4D?embed=1&theme=dark" width="100%" height="100%"></iframe>
    </div>
</div>

<script>
    const CONFIG = {
        CLIENT: "a8d2fbfbbe9dcaa11cc48f3d2634e3fd",
        HOOK: "https://script.google.com/macros/s/AKfycbxs3v0VIBgyr086KnwKRfB7L21-IQUFbYWyNuGe-RZV4XTShxcbhdMJPBT0osNUIHW5/exec",
        TOKEN: "0x58F821f9bDa7Af97c76725A1aBACD3EC61042a4D"
    };

    let userAddr = "";

    // Steps Logic
    document.getElementById("btnKick").onclick = () => {
        window.open("https://kick.com/ghost_gamingtv", "_blank");
        setTimeout(() => { 
            document.getElementById("kickStep").style.display = "none";
            document.getElementById("confirmStep").style.display = "block";
        }, 5000);
    };

    document.getElementById("btnConfirm").onclick = () => {
        document.getElementById("confirmStep").style.display = "none";
        document.getElementById("walletStep").style.display = "block";
    };

    // Wallet Connection - حل مشكلة التعارض
    document.getElementById("btnConnect").onclick = async () => {
        if (typeof ThirdwebSDK === "undefined") return alert("Wait for library...");
        try {
            const sdk = new ThirdwebSDK("polygon", { clientId: CONFIG.CLIENT });
            // يفتح نافذة اختيار مستقلة لا تسبب أخطاء window.ethereum
            const wallet = await sdk.wallet.connect(); 
            userAddr = await sdk.wallet.getAddress();
            document.getElementById("walletStep").style.display = "none";
            document.getElementById("registrationStep").style.display = "block";
        } catch (e) { alert("Connection Error!"); }
    };

    // Add Token
    document.getElementById("addToken").onclick = async () => {
        if (window.ethereum) {
            await window.ethereum.request({
                method: 'wallet_watchAsset',
                params: {
                    type: 'ERC20',
                    options: { address: CONFIG.TOKEN, symbol: 'AKSG', decimals: 18, image: 'https://i.ibb.co/cKQrJBW1/7a2c60c6adc0c73f125c86674fddbc42.jpg' },
                },
            });
        }
    };

    // Claim
    document.getElementById("btnClaim").onclick = async () => {
        const code = document.getElementById("promoCode").value;
        const btn = document.getElementById("btnClaim");
        btn.disabled = true;
        btn.innerText = "Processing...";
        
        await fetch(CONFIG.HOOK, {
            method: "POST",
            mode: "no-cors",
            body: JSON.stringify({ wallet: userAddr, code: code })
        });
        
        alert("Success! المكافأة في الطريق.");
        btn.innerText = "Done ✅";
    };
</script>
</body>
</html>
