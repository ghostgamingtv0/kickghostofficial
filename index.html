<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
<script src="https://unpkg.com/@thirdweb-dev/sdk@3/dist/thirdweb-sdk.browser.js"></script>

<style>
    :root {
        --primary-color: #a336ff; 
        --accent-color: #00ffa3;  
        --bg-dark: #020202;
        --card-bg: #111111;
        --kick-green: #00e701;
        --warning-red: #ff4d4d;
    }

    body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: var(--bg-dark); color: white; margin: 0; padding: 0; }
    .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
    
    header { text-align: center; padding: 20px 0; border-bottom: 1px solid #222; }
    .logo-container img { width: 100px; border-radius: 50%; border: 3px solid var(--primary-color); box-shadow: 0 0 20px var(--primary-color); }

    .grid-layout { display: grid; grid-template-columns: 1.5fr 1fr; gap: 20px; margin-top: 20px; }
    @media (max-width: 900px) { .grid-layout { grid-template-columns: 1fr; } }

    .section { background: var(--card-bg); padding: 20px; border-radius: 20px; border: 1px solid #222; text-align: center; margin-bottom: 20px; }
    
    /* Reward Table */
    .reward-table { width: 100%; border-collapse: collapse; margin-top: 15px; background: #000; border-radius: 10px; overflow: hidden; }
    .reward-table th, .reward-table td { padding: 10px; border: 1px solid #222; font-size: 0.85rem; text-align: center; }
    .reward-table th { background: var(--primary-color); color: white; }

    #chart-container { position: relative; width: 100%; padding-bottom: 60%; height: 0; overflow: hidden; border-radius: 15px; }
    #chart-container iframe { position: absolute; width: 100%; height: 100%; top: 0; left: 0; border: 0; }

    .btn-web3 { 
        background: linear-gradient(90deg, var(--primary-color), #7a1fd1);
        color: white; border: none; padding: 15px; width: 100%; border-radius: 12px;
        font-weight: bold; cursor: pointer; font-size: 1.1rem; margin-top: 15px;
        transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 10px;
    }
    .btn-kick { background: var(--kick-green); color: black; }
    
    .promo-input {
        width: 100%; padding: 12px; margin-top: 10px; border-radius: 8px; border: 1px solid var(--primary-color);
        background: #000; color: var(--accent-color); text-align: center; font-weight: bold; font-size: 1.2rem;
    }

    #confirmStep, #walletStep, #claimStep { display: none; }
    .warning-box { background: rgba(255, 77, 77, 0.1); border: 1px solid var(--warning-red); padding: 10px; border-radius: 10px; color: var(--warning-red); font-size: 0.8rem; margin-bottom: 15px; }
    .lang-switch { color: #888; font-size: 0.8rem; margin-bottom: 10px; display: block; }
    .social-links a { color: white; font-size: 1.8rem; margin: 0 10px; }
</style>
