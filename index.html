<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KICKGHOST ($AKSG) - Professional Rewards Hub</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    <script src="https://unpkg.com/@thirdweb-dev/sdk@latest/dist/thirdweb-sdk.browser.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Noto+Sans+Arabic:wght@300;600;800&display=swap');

        :root {
            --primary: #a336ff;
            --secondary: #00ffa3;
            --bg: #050505;
            --card: rgba(20, 20, 25, 0.8);
            --kick: #00e701;
            --text: #ffffff;
            --shadow: 0 0 20px rgba(163, 54, 255, 0.3);
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg);
            background-image: radial-gradient(circle at top right, #1a0b2e, transparent),
                              radial-gradient(circle at bottom left, #051a14, transparent);
            color: var(--text);
            font-family: 'Noto Sans Arabic', sans-serif;
            margin: 0;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }

        /* Header & Logo */
        header { text-align: center; padding: 60px 0 40px; }
        .logo-wrapper { position: relative; display: inline-block; }
        .logo-main {
            width: 150px; height: 150px; border-radius: 50%;
            border: 4px solid var(--primary);
            box-shadow: 0 0 40px var(--primary);
            transition: 0.5s;
            object-fit: cover;
        }
        .logo-main:hover { transform: rotate(360deg); box-shadow: 0 0 60px var(--secondary); }
        .project-title { font-family: 'Orbitron', sans-serif; font-size: 3rem; margin: 20px 0 10px; text-transform: uppercase; letter-spacing: 5px; background: linear-gradient(to right, #fff, var(--primary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* Main Dashboard Layout */
        .dashboard { display: grid; grid-template-columns: 1fr 350px; gap: 30px; }
        @media (max-width: 992px) { .dashboard { grid-template-columns: 1fr; } }

        .glass-card {
            background: var(--card);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            padding: 30px;
            box-shadow: var(--shadow);
        }

        /* Stepper Logic UI */
        .step-container { margin-bottom: 40px; }
        .step-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .badge { background: var(--primary); padding: 5px 15px; border-radius: 50px; font-size: 0.8rem; font-weight: bold; }

        .social-verify-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-bottom: 20px; }
        .verify-btn {
            background: #111; border: 1px solid #333; color: #fff; padding: 15px; border-radius: 15px;
            cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 10px; font-weight: 600;
        }
        .verify-btn:hover { border-color: var(--primary); background: #1a1a1a; }
        .verify-btn.completed { border-color: var(--secondary); color: var(--secondary); }
        .verify-btn i { font-size: 1.2rem; }

        /* Web3 Actions */
        .action-zone { text-align: center; padding: 20px; border: 2px dashed #333; border-radius: 20px; margin-top: 20px; }
        .btn-main {
            width: 100%; padding: 20px; border-radius: 18px; border: none; font-size: 1.2rem; font-weight: 800;
            cursor: pointer; transition: 0.4s; text-transform: uppercase; letter-spacing: 1px;
            display: flex; align-items: center; justify-content: center; gap: 15px;
        }
        .btn-wallet { background: linear-gradient(45deg, var(--primary), #6200ea); color: white; }
        .btn-claim { background: linear-gradient(45deg, var(--secondary), #00c853); color: black; display: none; }
        .btn-disabled { background: #333 !important; color: #666 !important; cursor: not-allowed !important; }

        /* Stats & Chart */
        .stats-sidebar { display: flex; flex-direction: column; gap: 20px; }
        .mini-stat { background: rgba(255,255,255,0.03); padding: 20px; border-radius: 20px; text-align: center; }
        .mini-stat h4 { margin: 0; color: #888; font-size: 0.9rem; }
        .mini-stat p { margin: 10px 0 0; font-family: 'Orbitron', sans-serif; font-size: 1.4rem; color: var(--secondary); }

        .chart-section { grid-column: 1 / -1; height: 600px; margin-top: 20px; }
        #gecko-iframe { width: 100%; height: 100%; border-radius: 30px; border: 1px solid #222; }

        /* Promo Input */
        .promo-wrapper { margin: 25px 0; position: relative; }
        .promo-input {
            width: 100%; background: #000; border: 2px solid #222; padding: 20px; border-radius: 15px;
            color: var(--secondary); text-align: center; font-family: 'Orbitron', sans-serif; font-size: 1.5rem; outline: none; transition: 0.3s;
        }
        .promo-input:focus { border-color: var(--primary); box-shadow: 0 0 15px var(--primary); }

        /* Notifications */
        #notify { position: fixed; bottom: 20px; left: 20px; padding: 15px 30px; border-radius: 10px; background: var(--primary); z-index: 9999; display: none; animation: slideIn 0.5s; }
        @keyframes slideIn { from { transform: translateX(-100%); } to { transform: translateX(0); } }

        .loading-spinner { border: 4px solid rgba(255,255,255,0.1); border-top: 4px solid var(--secondary); border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="notify"></div>

<div class="container">
    <header>
        <div class="logo-wrapper">
            <img src="https://i.ibb.co/cKQrJBW1/7a2c60c6adc0c73f125c86674fddbc42.jpg" class="logo-main" alt="AKSG Logo">
        </div>
        <h1 class="project-title">KICKGHOST $AKSG</h1>
        <p style="color: #aaa; font-size: 1.1rem;">نظام المكافآت الحصري لجيش Ghost Gaming TV</p>
    </header>

    <div class="dashboard">
        <div class="glass-card">
            <div class="step-header">
                <h3><i class="fas fa-tasks"></i> خطوات التأكيد والمطالبة</h3>
                <span class="badge" id="stepCounter">الخطوة 1 من 3</span>
            </div>

            <div id="socialStep">
                <p style="color: #888; margin-bottom: 20px;">يجب عليك تأكيد زيارة مواقع التواصل الاجتماعي أولاً:</p>
                <div class="social-verify-grid">
                    <button class="verify-btn" onclick="verifySocial('kick', 'https://kick.com/ghost_gamingtv')">
                        <i class="fab fa-kickstarter"></i> Kick Follow
                    </button>
                    <button class="verify-btn" onclick="verifySocial('twitter', 'https://x.com/tv_ghostgaming')">
                        <i class="fab fa-twitter"></i> Twitter
                    </button>
                    <button class="verify-btn" onclick="verifySocial('insta', 'https://www.instagram.com/ghost.gamingtv/')">
                        <i class="fab fa-instagram"></i> Instagram
                    </button>
                    <button class="verify-btn" onclick="verifySocial('tg', 'https://t.me/ghost_gamingtv')">
                        <i class="fab fa-telegram"></i> Telegram
                    </button>
                </div>
            </div>

            <div id="web3Step" style="opacity: 0.3; pointer-events: none;">
                <div class="promo-wrapper">
                    <input type="text" id="claimCode" class="promo-input" placeholder="ADRESS WALLET" maxlength="42">
                </div>
                
                <div class="action-zone">
                    <button id="mainBtn" class="btn-main btn-wallet" onclick="handleMainAction()">
                        <i class="fas fa-plug"></i> ربط المحفظة للتحقق
                    </button>
                </div>
            </div>
            
            <p id="errorMsg" style="color: var(--warning-red); margin-top: 15px; font-weight: bold; display: none;"></p>
        </div>

        <div class="stats-sidebar">
            <div class="glass-card mini-stat">
                <h4>Project ID</h4>
                <p style="font-size: 0.8rem; word-break: break-all;">prj_cmk2xz9h2...kc2gan3o0</p>
            </div>
            <div class="glass-card mini-stat">
                <h4>Network</h4>
                <p>Polygon (Mainnet)</p>
            </div>
            <div class="glass-card mini-stat">
                <h4>المكافأة</h4>
                <p>1000 AKSG</p>
            </div>
            <div class="glass-card mini-stat">
                <h4>الحالة</h4>
                <p id="walletStatus" style="color: #666;">غير متصل</p>
            </div>
        </div>

        <div class="glass-card chart-section">
            <div class="step-header">
                <h3><i class="fas fa-chart-line"></i> سعر AKSG المباشر (GeckoTerminal)</h3>
            </div>
            <iframe id="gecko-iframe" src="https://www.geckoterminal.com/polygon_pos/pools/0x58F821f9bDa7Af97c76725A1aBACD3EC61042a4D?embed=1&info=0&swaps=1"></iframe>
        </div>
    </div>
</div>

<script>
    // --- الإعدادات الفنية ---
    const CONFIG = {
        CLIENT_ID: "a8d2fbfbbe9dcaa11cc48f3d2634e3fd",
        PROJECT_ID: "prj_cmk2xz9h214g2fw0kc2gan3o0",
        TOKEN_ADDR: "0x58F821f9bDa7Af97c76725A1aBACD3EC61042a4D",
        WEBHOOK: "https://script.google.com/macros/s/AKfycbxs3v0VIBgyr086KnwKRfB7L21-IQUFbYWyNuGe-RZV4XTShxcbhdMJPBT0osNUIHW5/exec"
    };

    let verifiedCount = 0;
    const verifiedSteps = { kick: false, twitter: false, insta: false, tg: false };
    let userAddress = "";
    let isClaimed = false;

    // --- نظام التحقق من التواصل ---
    function verifySocial(platform, url) {
        if (verifiedSteps[platform]) return;

        window.open(url, '_blank');
        showNotify(`جاري التحقق من ${platform}... انتظر 5 ثوانٍ`);
        
        const btn = event.currentTarget;
        btn.innerHTML = `<div class="loading-spinner"></div>`;

        setTimeout(() => {
            verifiedSteps[platform] = true;
            verifiedCount++;
            btn.classList.add('completed');
            btn.innerHTML = `<i class="fas fa-check-circle"></i> تم التأكيد`;
            
            if (verifiedCount === 4) {
                unlockWeb3();
            }
        }, 5000);
    }

    function unlockWeb3() {
        document.getElementById('web3Step').style.opacity = "1";
        document.getElementById('web3Step').style.pointerEvents = "all";
        document.getElementById('stepCounter').innerText = "الخطوة 2 من 3";
        showNotify("✅ تم فتح نظام المكافآت!");
    }

    // --- نظام Web3 ---
    async function handleMainAction() {
        if (!userAddress) {
            connectWallet();
        } else {
            claimAksg();
        }
    }

    async function connectWallet() {
        if (typeof window.ethereum === 'undefined') {
            return alert("يرجى تثبيت MetaMask لاستخدام هذا النظام!");
        }

        try {
            const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
            userAddress = accounts[0];
            
            // تحقق من التكرار في LocalStorage
            if (localStorage.getItem(`claimed_${userAddress}`)) {
                isClaimed = true;
            }

            updateUIConnected();
        } catch (err) {
            console.error(err);
        }
    }

    function updateUIConnected() {
        document.getElementById('walletStatus').innerText = "متصل: " + userAddress.substring(0,6) + "...";
        document.getElementById('walletStatus').style.color = CONFIG.secondary;
        document.getElementById('stepCounter').innerText = "الخطوة الأخيرة";
        
        const btn = document.getElementById('mainBtn');
        if (isClaimed) {
            btn.className = "btn-main btn-disabled";
            btn.innerHTML = `<i class="fas fa-ban"></i> تم استلام المكافأة سابقاً`;
            btn.onclick = null;
        } else {
            btn.className = "btn-main btn-claim";
            btn.style.display = "flex";
            btn.innerHTML = `<i class="fas fa-coins"></i> CLAIM 1000 AKSG`;
            document.getElementById('claimCode').value = userAddress;
        }
    }

    async function claimAksg() {
        const btn = document.getElementById('mainBtn');
        btn.innerHTML = `<div class="loading-spinner"></div> جاري المعالجة...`;
        btn.disabled = true;

        try {
            // إضافة التوكن للمحفظة
            await window.ethereum.request({
                method: 'wallet_watchAsset',
                params: {
                    type: 'ERC20',
                    options: {
                        address: CONFIG.TOKEN_ADDR,
                        symbol: 'AKSG',
                        decimals: 18,
                        image: 'https://i.ibb.co/cKQrJBW1/7a2c60c6adc0c73f125c86674fddbc42.jpg',
                    },
                },
            });

            // إرسال البيانات للـ Webhook (التسجيل النهائي)
            await fetch(CONFIG.WEBHOOK, {
                method: "POST",
                mode: "no-cors",
                body: JSON.stringify({
                    wallet: userAddress,
                    project: CONFIG.PROJECT_ID,
                    action: "CLAIM_1000_AKSG",
                    date: new Date().toLocaleString()
                })
            });

            // حفظ الحالة لمنع التكرار
            localStorage.setItem(`claimed_${userAddress}`, "true");
            
            // احتفال
            confetti({
                particleCount: 150,
                spread: 70,
                origin: { y: 0.6 },
                colors: ['#a336ff', '#00ffa3', '#ffffff']
            });

            btn.className = "btn-main btn-disabled";
            btn.innerHTML = `<i class="fas fa-check-double"></i> تمت العملية بنجاح!`;
            showNotify("🎉 مبروك! سيتم إرسال العملات قريباً.");

        } catch (err) {
            btn.disabled = false;
            btn.innerHTML = `<i class="fas fa-coins"></i> CLAIM 1000 AKSG`;
            alert("حدث خطأ أثناء المحاولة.");
        }
    }

    function showNotify(msg) {
        const n = document.getElementById('notify');
        n.innerText = msg;
        n.style.display = 'block';
        setTimeout(() => n.style.display = 'none', 4000);
    }
</script>

</body>
</html>
