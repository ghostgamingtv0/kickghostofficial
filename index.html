<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KICKG ($AKSG) - Live Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    <script src="https://unpkg.com/@thirdweb-dev/sdk@3/dist/thirdweb-sdk.browser.js"></script>

    <style>
        :root {
            --primary-color: #a336ff; 
            --accent-color: #00ffa3;  
            --bg-dark: #020202;
            --card-bg: #0d0d0d;
            --kick-green: #00e701;
        }

        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg-dark); color: white; margin: 0; padding: 0; }
        .container { max-width: 1100px; margin: 0 auto; padding: 20px; }
        
        header { text-align: center; padding: 20px 0; border-bottom: 1px solid #222; }
        .logo-container img { width: 100px; border-radius: 50%; border: 3px solid var(--primary-color); box-shadow: 0 0 15px var(--primary-color); }

        /* تقسيم الصفحة */
        .grid-layout { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; margin-top: 20px; }
        @media (max-width: 900px) { .grid-layout { grid-template-columns: 1fr; } }

        .section { background: var(--card-bg); padding: 20px; border-radius: 20px; border: 1px solid #222; text-align: center; }
        
        /* شارت لايف */
        #dexscreener-embed { position: relative; width: 100%; padding-bottom: 125%; height: 0; }
        @media (min-width: 1400px) { #dexscreener-embed { padding-bottom: 65%; } }
        #dexscreener-embed iframe { position: absolute; width: 100%; height: 100%; top: 0; left: 0; border: 0; border-radius: 15px; }

        .btn-web3 { 
            background: linear-gradient(90deg, var(--primary-color), #7a1fd1);
            color: white; border: none; padding: 15px; width: 100%; border-radius: 12px;
            font-weight: bold; cursor: pointer; font-size: 1rem; margin-top: 10px;
            transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        
        .btn-kick { background: var(--kick-green); color: black; margin-bottom: 12px; }
        
        #claimBtn { 
            background: linear-gradient(90deg, #ff00cc, #3333ff); 
            display: none; 
            margin-top: 20px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 0, 204, 0.7); }
            70% { transform: scale(1.03); box-shadow: 0 0 0 10px rgba(255, 0, 204, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 0, 204, 0); }
        }

        .status-badge { font-size: 0.75rem; padding: 8px; border-radius: 8px; background: #1a1a1a; border: 1px solid #333; margin: 5px; display: inline-block; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="logo-container">
            <img src="https://i.ibb.co/cKQrJBW1/7a2c60c6adc0c73f125c86674fddbc42.jpg" alt="KICKG">
        </div>
        <h1>KICKG ($AKSG) Live Dashboard</h1>
    </header>

    <div class="grid-layout">
        <div class="left-col">
            <div class="section" style="padding: 10px;">
                <h3 style="margin-bottom: 15px;"><i class="fas fa-chart-line"></i> Live Market Chart</h3>
                <div id="dexscreener-embed">
                    <iframe src="https://dexscreener.com/polygon/0xa8a79e754308d00690a75d264a7c3ba07bbf2a76?embed=1&theme=dark&trades=0&info=0"></iframe>
                </div>
            </div>
        </div>

        <div class="right-col">
            <div class="section" style="margin-bottom: 20px;">
                <h3><i class="fas fa-pie-chart"></i> Tokenomics</h3>
                <div style="height: 180px;"><canvas id="tokenChart"></canvas></div>
            </div>

            <div class="section">
                <h3><i class="fas fa-verify"></i> Verification</h3>
                <div class="status-badge" id="step1">Kick Login ❌</div>
                <div class="status-badge" id="step2">Wallet ❌</div>

                <button class="btn-web3 btn-kick" id="kickLogin"><i class="fab fa-kickstarter"></i> Login with Kick</button>
                <button class="btn-web3" id="connectWallet"><i class="fas fa-wallet"></i> Connect Wallet</button>
                
                <button class="btn-web3" id="claimBtn"><i class="fas fa-coins"></i> CLAIM $AKSG REWARD</button>
                
                <p id="statusMsg" style="font-size: 0.8rem; color: #555; margin-top: 10px;">Verify identity to unlock claim</p>
            </div>
        </div>
    </div>
</div>

<script>
    // الإعدادات والمفاتيح
    const KICK_CLIENT_ID = "01KE7GJK96RS6CGAF5G2HSQR9F";
    const THIRDWEB_CLIENT_ID = "5ed0be08816a9f32809c6e550046bf03"; 
    const CONTRACT_ADDRESS = "0x58F821f9bDa7Af97c76725A1aBACD3EC61042a4D";

    let kickDone = false;
    let walletDone = false;

    // شارت التوكنوميكس الدائري
    const tCtx = document.getElementById('tokenChart').getContext('2d');
    new Chart(tCtx, {
        type: 'doughnut',
        data: {
            labels: ['Burn', 'Liquidity', 'Airdrops', 'Team'],
            datasets: [{
                data: [40, 30, 20, 10],
                backgroundColor: ['#a336ff', '#00ffa3', '#444', '#222'],
                borderWidth: 0
            }]
        },
        options: { maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { color: '#ccc', font: {size: 10} } } } }
    });

    // منطق الأزرار
    function checkStatus() {
        if (kickDone && walletDone) {
            document.getElementById("claimBtn").style.display = "flex";
            document.getElementById("statusMsg").innerText = "Eligible for Reward! 🚀";
            document.getElementById("statusMsg").style.color = "#00ffa3";
        }
    }

    document.getElementById("kickLogin").onclick = () => {
        window.location.href = `https://kick.com/oauth/authorize?client_id=${KICK_CLIENT_ID}&redirect_uri=${encodeURIComponent(window.location.href.split('?')[0])}&response_type=code&scope=user:read`;
    };

    document.getElementById("connectWallet").onclick = async () => {
        if (window.ethereum) {
            try {
                await window.ethereum.request({ method: 'eth_requestAccounts' });
                walletDone = true;
                document.getElementById("step2").innerText = "Wallet ✅";
                document.getElementById("step2").style.color = "#00ffa3";
                checkStatus();
            } catch (e) { alert("Connect failed"); }
        } else { alert("Use Web3 Browser"); }
    };

    document.getElementById("claimBtn").onclick = async () => {
        try {
            document.getElementById("claimBtn").innerText = "Sending... ⏳";
            const sdk = new window.ThirdwebSDK("polygon", { clientId: THIRDWEB_CLIENT_ID });
            const contract = await sdk.getContract(CONTRACT_ADDRESS);
            await contract.erc20.claim(1); 
            alert("Success! Check your wallet. ✅");
            document.getElementById("claimBtn").innerText = "CLAIMED ✅";
        } catch (err) {
            alert("Claim failed: Check gas/settings.");
            document.getElementById("claimBtn").innerText = "CLAIM $AKSG";
        }
    };

    window.onload = () => {
        if (new URLSearchParams(window.location.search).get('code')) {
            kickDone = true;
            document.getElementById("kickLogin").innerText = "Kick Verified ✅";
            document.getElementById("step1").innerText = "Kick ✅";
            document.getElementById("step1").style.color = "#00ffa3";
            checkStatus();
        }
    };
</script>
</body>
</html>
