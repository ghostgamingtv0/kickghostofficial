<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
    <meta charset="UTF-8">
    <title>KICKGHOST</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Ethers.js -->
    <script src="https://cdn.jsdelivr.net/npm/ethers@6.10.0/dist/ethers.umd.min.js"></script>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        body { 
            background-color: #000; 
            color: #fff; 
            font-family: 'Inter', sans-serif; 
        }
        .text-neon-green { color: #00ff00; text-shadow: 0 0 10px rgba(0, 255, 0, 0.5); }
        .bg-neon-green { background-color: #00ff00; }
        .btn-hover:hover { transform: scale(1.02); transition: all 0.2s; }
        .glow { box-shadow: 0 0 20px rgba(0, 255, 0, 0.3); }
    </style>
</head>
<body class="flex flex-col items-center min-h-screen p-4 pb-20">

    <!-- Header Section -->
    <header class="mt-8 text-center animate-fade-in-down">
        <img src="https://i.postimg.cc/QxwZ3rtb/fe17c807e4ae7e98a858b5142f8b982e.jpg" 
             class="w-24 h-24 mx-auto rounded-full border-4 border-[#00ff00] glow mb-4">
        
        <h1 class="text-5xl font-black italic tracking-tighter uppercase">
            KICK<span class="text-neon-green">GHOST</span>
        </h1>
        <p class="text-gray-400 font-bold tracking-widest mt-2 text-sm uppercase">The Ultimate Interactive Token</p>
        
        <!-- Social Links (Preserved) -->
        <div class="flex justify-center gap-6 mt-4 text-sm font-bold text-gray-300">
            <a href="https://kick.com/ghost_gamingtv" target="_blank" class="hover:text-[#00ff00]">KICK</a>
            <a href="https://www.instagram.com/ghost.gamingtv/" target="_blank" class="hover:text-[#00ff00]">INSTAGRAM</a>
            <a href="https://x.com/tv_ghostgaming" target="_blank" class="hover:text-[#00ff00]">TWITTER</a>
        </div>
    </header>

    <!-- Actions Section -->
    <div class="mt-10 w-full max-w-md space-y-6">
        
        <!-- Step 1: Login -->
        <div class="text-center">
            <button onclick="loginWithKick()" 
                    class="w-full bg-[#00ff00] text-black py-4 rounded-xl font-black text-xl shadow-lg btn-hover flex items-center justify-center gap-2">
                STEP 1: LOGIN WITH KICK 🎥
            </button>
            <p class="text-[#00ff00] text-xs mt-1 font-bold">المرحلة 1: تسجيل الدخول عبر كيك</p>
        </div>

        <!-- Step 2: Connect Wallet -->
        <div class="text-center">
            <button onclick="connectWallet()" 
                    class="w-full bg-white text-black py-4 rounded-xl font-black text-xl shadow-lg btn-hover flex items-center justify-center gap-2">
                STEP 2: CONNECT WALLET 👻
            </button>
            <p class="text-white text-xs mt-1 font-bold">المرحلة 2: ربط المحفظة</p>
            <p id="walletAddress" class="text-[#00ff00] font-mono mt-2 text-sm break-all hidden"></p>
        </div>

        <!-- Step 3: Claim (Preserved) -->
        <div class="text-center">
            <button onclick="claim()" 
                    class="w-full bg-gray-800 text-white border border-gray-600 py-4 rounded-xl font-bold text-lg shadow-lg btn-hover flex items-center justify-center gap-2">
                CLAIM 1000 (WEEKLY) 🎁
            </button>
            <p id="claimMsg" class="text-yellow-400 font-bold mt-2 text-sm"></p>
        </div>

    </div>

    <!-- Chart Section -->
    <div class="mt-16 w-full max-w-5xl relative">
        <div class="flex items-center gap-2 mb-2 px-2">
            <!-- GeckoTerminal Logo Placeholder / Text -->
            <span class="text-gray-400 text-sm font-bold flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-[#00ff00]" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
                </svg>
                Powered by GeckoTerminal
            </span>
        </div>
        
        <div class="h-[600px] border-2 border-[#00ff00] rounded-2xl overflow-hidden shadow-2xl shadow-[#00ff00]/20 bg-gray-900">
            <!-- GeckoTerminal Widget -->
            <!-- Using WPOL pool on Polygon as placeholder since specific token address is unknown. 
                 User can replace the address in the src URL. -->
            <iframe height="100%" width="100%" id="geckoterminal-embed" title="GeckoTerminal Embed" src="https://www.geckoterminal.com/polygon/pools/0x0d500b1d8e8ef31e21c99d1db9a6444d3adf1270?embed=1&info=0&swaps=0" frameborder="0" allow="clipboard-write" allowfullscreen></iframe>
        </div>
        <p class="text-center text-gray-500 text-xs mt-2">If the chart is incorrect, please update the pool address in index.html line 88.</p>
    </div>

    <script>
        let userAddress = null;

        // Login with Kick
        function loginWithKick(){
            window.location.href = "/api/kick/login";
        }

        // Connect Wallet using Ethers.js
        async function connectWallet(){
            if(window.ethereum){
                try {
                    const provider = new ethers.BrowserProvider(window.ethereum);
                    await provider.send("eth_requestAccounts", []);
                    const signer = await provider.getSigner();
                    userAddress = await signer.getAddress();
                    
                    const walletEl = document.getElementById("walletAddress");
                    walletEl.innerText = "Connected: " + userAddress;
                    walletEl.classList.remove("hidden");
                    
                } catch (error) {
                    console.error(error);
                    alert("Error connecting wallet: " + error.message);
                }
            } else {
                alert("Please install MetaMask, TrustWallet, or Coinbase Wallet!");
            }
        }

        // Claim Function
        async function claim(){
            if(!userAddress){ 
                alert("Please connect your wallet first (Step 2)!"); 
                return; 
            }
            
            const btn = document.querySelector('button[onclick="claim()"]');
            const originalText = btn.innerText;
            btn.innerText = "Processing...";
            btn.disabled = true;

            try {
                const res = await fetch("/api/claim",{
                    method:"POST",
                    headers:{ "Content-Type":"application/json" },
                    body:JSON.stringify({ address: userAddress })
                });
                const data = await res.json();
                document.getElementById("claimMsg").innerText = data.message;
            } catch (e) {
                document.getElementById("claimMsg").innerText = "Error claiming.";
            }
            
            btn.innerText = originalText;
            btn.disabled = false;
        }
    </script>
</body>
</html>
