<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KICKG ($AKSG) - Web3 Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    <script src="https://unpkg.com/@thirdweb-dev/sdk@3/dist/thirdweb-sdk.browser.js"></script>

    <style>
        :root {
            --primary-color: #a336ff; /* بنفسجي اللوجو */
            --accent-color: #00ffa3;  /* أخضر كيك */
            --bg-dark: #020202;
            --card-bg: #0d0d0d;
            --glow: rgba(163, 54, 255, 0.3);
        }

        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg-dark); color: white; margin: 0; padding: 0; }
        .container { max-width: 1000px; margin: 0 auto; padding: 20px; }
        
        header { text-align: center; padding: 40px 0; background: radial-gradient(circle at center, var(--glow) 0%, transparent 70%); }
        .logo-container img { width: 150px; border-radius: 50%; border: 4px solid var(--primary-color); box-shadow: 0 0 30px var(--primary-color); }
        .logo-text { font-size: 2.8rem; font-weight: 900; color: white; margin-top: 15px; }

        .live-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .stat-card { background: #0d0d0d; padding: 20px; border-radius: 15px; border: 1px solid #222; text-align: center; }
        .stat-card p { color: var(--accent-color); font-size: 1.4rem; font-weight: bold; margin: 10px 0 0 0; }

        .main-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 768px) { .main-grid { grid-template-columns: 1fr; } }

        .section { background: var(--card-bg); padding: 25px; border-radius: 20px; border: 1px solid #222; }
        h2 { color: var(--primary-color); font-size: 1.5rem; display: flex; align-items: center; gap: 10px; }
        
        .btn-web3 { 
            background: linear-gradient(90deg, var(--primary-color), #7a1fd1);
            color: white; border: none; padding: 15px; width: 100%; border-radius: 12px;
            font-weight: bold; cursor: pointer; font-size: 1.1rem; margin-top: 10px;
            transition: 0.3s; box-shadow: 0 4px 15px rgba(163, 54, 255, 0.4);
        }
        .btn-web3:hover { transform: scale(1.02); opacity: 0.9; }

        .contract-box { background: #000; padding: 12px; border-radius: 10px; border: 1px dashed #444; margin-top: 10px; display: flex; justify-content: space-between; align-items: center; }
        .addr-text { color: var(--accent-color); font-family: monospace; font-size: 0.8rem; overflow: hidden; }

        .social-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 15px; }
        .social-btn { background: #151515; color: white; text-decoration: none; padding: 12px; border-radius: 10px; text-align: center; border: 1px solid #333; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="logo-container">
            <img src="https://i.ibb.co/cKQrJBW1/7a2c60c6adc0c73f125c86674fddbc42.jpg" alt="KICKG">
        </div>
        <div class="logo-text">KICKG ($AKSG)</div>
        <p style="color: var(--primary-color);">Official KICKG Ecosystem</p>
    </header>

    <div class="live-stats">
        <div class="stat-card"><h3>MARKET CAP</h3><p>$1,240.55</p></div>
        <div class="stat-card"><h3>LIQUIDITY</h3><p>$354.21</p></div>
        <div class="stat-card"><h3>NETWORK</h3><p>Polygon</p></div>
    </div>

    <div class="main-grid">
        <div class="section">
            <h2><i class="fas fa-chart-pie"></i> Tokenomics</h2>
            <div style="height: 250px;"><canvas id="tokenChart"></canvas></div>
        </div>

        <div class="section">
            <h2><i class="fas fa-wallet"></i> Web3 Access</h2>
            <button class="btn-web3" id="connectWallet">Connect Wallet 👻</button>
            <div class="contract-box">
                <span class="addr-text" id="contractAddr">0x58F821f9bDa7Af97c76725A1aBACD3EC61042a4D</span>
                <i class="fas fa-copy" style="cursor:pointer" onclick="copyAddr()"></i>
            </div>
            <p style="font-size: 0.8rem; color: #666; text-align: center;">اضغط للربط والحصول على المكافآت</p>
        </div>
    </div>

    <div class="section" style="margin-top: 20px;">
        <h2><i class="fas fa-link"></i> Social Links</h2>
        <div class="social-grid">
            <a href="https://kick.com/ghost_gamingtv" class="social-btn" target="_blank">Kick</a>
            <a href="https://t.me/ghost_gamingtv" class="social-btn" target="_blank">Telegram</a>
            <a href="https://x.com/tv_ghostgaming" class="social-btn" target="_blank">Twitter</a>
            <a href="https://dexscreener.com/polygon/0xa8a79e754308d00690a75d264a7c3ba07bbf2a76" class="social-btn" target="_blank">Chart</a>
        </div>
    </div>
</div>

<script>
    // إعدادات Thirdweb الخاصة بك
    const CLIENT_ID = "5ed0be08816a9f32809c6e550046bf03"; 

    // تفعيل زر ربط المحفظة
    document.getElementById("connectWallet").onclick = async () => {
        if (window.ethereum) {
            try {
                const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                document.getElementById("connectWallet").innerText = "Connected: " + accounts[0].substring(0,6) + "...";
                alert("تم ربط محفظتك بمشروع KICKG!");
            } catch (err) { alert("فشل الاتصال بالقمحفظة"); }
        } else {
            alert("المرجو فتح الموقع من داخل MetaMask أو Trust Wallet");
        }
    };

    // الشارت
    const ctx = document.getElementById('tokenChart').getContext('2d');
    new Chart(ctx, {
        type: 'doughnut',
        data: {
            labels: ['Burned', 'Liquidity', 'Airdrops', 'Team'],
            datasets: [{
                data: [40, 30, 20, 10],
                backgroundColor: ['#a336ff', '#00ffa3', '#444', '#222'],
                borderWidth: 0
            }]
        },
        options: { maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { color: '#ccc' } } } }
    });

    function copyAddr() {
        navigator.clipboard.writeText("0x58F821f9bDa7Af97c76725A1aBACD3EC61042a4D");
        alert("Contract Copied!");
    }
</script>
</body>
</html>
