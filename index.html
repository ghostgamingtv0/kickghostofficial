<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KICKG ($AKSG) - Rewards Hub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <script src="https://unpkg.com/@thirdweb-dev/sdk@latest/dist/thirdweb-sdk.browser.js"></script>

    <style>
        :root {
            --primary-color: #a336ff; 
            --accent-color: #00ffa3;  
            --bg-dark: #020202;
            --card-bg: #111111;
            --kick-green: #00e701;
            --warning-red: #ff4d4d;
        }

        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: var(--bg-dark); color: white; margin: 0; padding: 0; }
        .container { max-width: 800px; margin: 0 auto; padding: 20px; }
        
        header { text-align: center; padding: 30px 0; }
        .logo-container img { width: 120px; border-radius: 50%; border: 3px solid var(--primary-color); box-shadow: 0 0 25px var(--primary-color); }

        .section { background: var(--card-bg); padding: 25px; border-radius: 20px; border: 1px solid #222; text-align: center; margin-bottom: 25px; }
        
        .reward-table { width: 100%; border-collapse: collapse; margin: 20px 0; background: #000; border-radius: 12px; overflow: hidden; }
        .reward-table th, .reward-table td { padding: 15px; border: 1px solid #222; text-align: center; }
        .reward-table th { background: var(--primary-color); color: white; }

        .btn-web3 { 
            background: linear-gradient(90deg, var(--primary-color), #7a1fd1);
            color: white; border: none; padding: 15px; width: 100%; border-radius: 12px;
            font-weight: bold; cursor: pointer; font-size: 1.1rem; margin-top: 15px;
            transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .btn-kick { background: var(--kick-green); color: black; }
        
        .promo-input {
            width: 100%; padding: 12px; margin-top: 10px; border-radius: 8px; border: 1px solid var(--primary-color);
            background: #000; color: var(--accent-color); text-align: center; font-weight: bold; font-size: 1.2rem;
            box-sizing: border-box;
        }

        #chart-container { width: 100%; height: 500px; border-radius: 15px; overflow: hidden; border: 1px solid #333; margin-top: 20px; }
        
        #confirmStep, #walletStep, #registrationStep { display: none; }
        .warning-box { background: rgba(255, 77, 77, 0.1); border: 1px solid var(--warning-red); padding: 15px; border-radius: 10px; color: var(--warning-red); margin-bottom: 20px; }
        .social-links { margin-top: 20px; }
        .social-links a { color: white; font-size: 2rem; margin: 0 15px; transition: 0.3s; }
        .social-links a:hover { color: var(--primary-color); }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="logo-container">
            <img src="https://i.ibb.co/cKQrJBW1/7a2c60c6adc0c73f125c86674fddbc42.jpg" alt="KICKG">
        </div>
        <h1>KICKGHOST ($AKSG)</h1>
        <p>المنصة الرسمية لمكافآت Ghost Gaming TV</p>
    </header>

    <div class="section">
        <h3><i class="fas fa-gift"></i> نظام المكافآت</h3>
        <table class="reward-table">
            <thead>
                <tr>
                    <th>النشاط</th>
                    <th>الجائزة</th>
                </tr>
            </thead>
            <tbody>
                <tr><td>متابعة القناة</td><td style="color:var(--accent-color)">500 $AKSG</td></tr>
                <tr><td>ساعة مشاهدة</td><td style="color:var(--accent-color)">100 $AKSG</td></tr>
            </tbody>
        </table>
    </div>

    <div class="section">
        <h3><i class="fas fa-user-check"></i> سجل محفظتك هنا</h3>
        
        <div class="warning-box" id="statusBox">
            <i class="fas fa-info-circle"></i> يرجى إتمام الخطوات لتسجيل طلبك.
        </div>

        <div id="kickStep">
            <button class="btn-web3 btn-kick" id="kickAction">
                <i class="fab fa-kickstarter"></i> 1. متابعة GHOST_GAMINGTV
            </button>
            <div id="timerBox" style="display:none; margin-top:10px;">انتظر للتأكيد: <span id="seconds">5</span> ثواني</div>
        </div>

        <div id="confirmStep">
            <button class="btn-web3" id="confirmAction">2. أكدت المتابعة ✅</button>
        </div>

        <div id="walletStep">
            <button class="btn-web3" id="connectWallet"><i class="fas fa-wallet"></i> 3. ربط المحفظة</button>
        </div>

        <div id="registrationStep">
            <label>أدخل كود الجائزة من البث:</label>
            <input type="text" id="promoCodeInput" class="promo-input" placeholder="أدخل الكود هنا">
            <button class="btn-web3" id="submitAction">تسجيل المحفظة الآن</button>
        </div>
    </div>

    <div class="section">
        <h3><i class="fas fa-chart-line"></i> الشارت المباشر</h3>
        <div id="chart-container">
            <iframe src="https://dexscreener.com/polygon/0x58F821f9bDa7Af97c76725A1aBACD3EC61042a4D?embed=1&theme=dark&trades=0&info=0" width="100%" height="100%" style="border:0;"></iframe>
        </div>
    </div>

    <div class="section">
        <h3>روابط التواصل الرسمية</h3>
        <div class="social-links">
            <a href="https://kick.com/ghost_gamingtv" target="_blank"><i class="fab fa-kickstarter"></i></a>
            <a href="https://x.com/tv_ghostgaming" target="_blank"><i class="fab fa-twitter"></i></a>
            <a href="https://www.instagram.com/ghost.gamingtv?igsh=MTdycjI4b3Z5cWxhag==" target="_blank"><i class="fab fa-instagram"></i></a>
            <a href="https://t.me/ghost_gamingtv" target="_blank"><i class="fab fa-telegram"></i></a>
        </div>
        <p style="margin-top:20px; font-size:0.7rem; color:#444;">Contract: 0x58F821f9bDa7Af97c76725A1aBACD3EC61042a4D</p>
    </div>
</div>

<script>
    const CONFIG = {
        CLIENT_ID: "a8d2fbfbbe9dcaa11cc48f3d3634e3fd",
        WEBHOOK_URL: "https://script.google.com/macros/s/AKfycbxs3v0VIBgyr086KnwKRfB7L21-IQUFbYWyNuGe-RZV4XTShxcbhdMJPBT0osNUIHW5/exec"
    };

    let userWalletAddress = "";

    // منطق التنقل
    document.getElementById("kickAction").onclick = function() {
        window.open("https://kick.com/ghost_gamingtv", "_blank");
        this.disabled = true;
        document.getElementById("timerBox").style.display = "block";
        let timeLeft = 5;
        const timer = setInterval(() => {
            timeLeft--;
            document.getElementById("seconds").innerText = timeLeft;
            if (timeLeft <= 0) {
                clearInterval(timer);
                document.getElementById("kickStep").style.display = "none";
                document.getElementById("confirmStep").style.display = "block";
            }
        }, 1000);
    };

    document.getElementById("confirmAction").onclick = () => {
        document.getElementById("confirmStep").style.display = "none";
        document.getElementById("walletStep").style.display = "block";
    };

    // ربط المحفظة - النسخة المصححة
    document.getElementById("connectWallet").onclick = async () => {
        try {
            // التحقق من وجود محفظة لتجنب انهيار الكود
            if (typeof window.ethereum === 'undefined' && !window.trustwallet) {
                alert("لم يتم العثور على محفظة. يرجى فتح الموقع من متصفح MetaMask أو Trust Wallet.");
                return;
            }

            const sdk = new ThirdwebSDK("polygon", { clientId: CONFIG.CLIENT_ID });
            
            // محاولة الاتصال
            const address = await sdk.wallet.connect();
            userWalletAddress = address;
            
            if(userWalletAddress) {
                document.getElementById("walletStep").style.display = "none";
                document.getElementById("registrationStep").style.display = "block";
                document.getElementById("statusBox").innerHTML = "✅ تم الربط بنجاح!";
                document.getElementById("statusBox").style.color = "var(--accent-color)";
            }
        } catch (err) { 
            console.error("Connection error:", err);
            alert("حدث خطأ أثناء الاتصال بالمحفظة. تأكد من إغلاق المحافظ الأخرى وتجربة MetaMask فقط."); 
        }
    };

    // إرسال البيانات
    document.getElementById("submitAction").onclick = async () => {
        const code = document.getElementById("promoCodeInput").value.toUpperCase();
        if (!code) { alert("أدخل الكود!"); return; }

        try {
            document.getElementById("submitAction").innerText = "جاري الحفظ...";
            document.getElementById("submitAction").disabled = true;

            await fetch(CONFIG.WEBHOOK_URL, {
                method: "POST",
                mode: "no-cors",
                body: JSON.stringify({
                    address: userWalletAddress,
                    promoCode: code,
                    date: new Date().toLocaleString()
                })
            });

            alert("تم تسجيل محفظتك بنجاح!");
            document.getElementById("submitAction").innerText = "تم التسجيل ✅";
            document.getElementById("statusBox").innerHTML = "✅ تم الاستلام! المكافآت قادمة يا بطل.";
        } catch (err) {
            alert("حدث خطأ في الشبكة، حاول لاحقاً.");
            document.getElementById("submitAction").disabled = false;
            document.getElementById("submitAction").innerText = "تسجيل المحفظة الآن";
        }
    };
</script>
</body>
</html>
