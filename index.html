<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KICKG ($AKSG) - Multi-Browser Rewards</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    <script src="https://unpkg.com/@thirdweb-dev/sdk@3/dist/thirdweb-sdk.browser.js"></script>

    <style>
        :root {
            --primary-color: #a336ff; 
            --accent-color: #00ffa3;  
            --bg-dark: #020202;
            --card-bg: #0d0d0d;
            --kick-green: #00e701;
            --warning-red: #ff4d4d;
        }

        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: var(--bg-dark); color: white; margin: 0; padding: 0; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        
        header { text-align: center; padding: 30px 0; border-bottom: 1px solid #222; }
        .logo-container img { width: 120px; border-radius: 50%; border: 3px solid var(--primary-color); box-shadow: 0 0 20px var(--primary-color); }

        .grid-layout { display: grid; grid-template-columns: 1.5fr 1fr; gap: 20px; margin-top: 20px; }
        @media (max-width: 900px) { .grid-layout { grid-template-columns: 1fr; } }

        .section { background: var(--card-bg); padding: 25px; border-radius: 20px; border: 1px solid #222; text-align: center; margin-bottom: 20px; }
        
        #chart-container { position: relative; width: 100%; padding-bottom: 70%; height: 0; overflow: hidden; border-radius: 15px; }
        #chart-container iframe { position: absolute; width: 100%; height: 100%; top: 0; left: 0; border: 0; }

        .btn-web3 { 
            background: linear-gradient(90deg, var(--primary-color), #7a1fd1);
            color: white; border: none; padding: 15px 25px; width: 100%; border-radius: 12px;
            font-weight: bold; cursor: pointer; font-size: 1.1rem; margin-top: 15px;
            transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .btn-kick { background: var(--kick-green); color: black; }
        .btn-kick:disabled { background: #333; cursor: not-allowed; }
        
        .warning-box {
            background: rgba(255, 77, 77, 0.1);
            border: 1px solid var(--warning-red);
            padding: 15px; border-radius: 12px; color: var(--warning-red);
            font-size: 0.9rem; margin-bottom: 20px; display: flex; align-items: center; gap: 10px;
        }

        #confirmStep, #walletStep, #claimStep { display: none; }
        .status-badge { font-size: 0.8rem; padding: 10px; border-radius: 10px; background: #1a1a1a; border: 1px solid #333; margin: 5px; display: inline-block; width: 40%; }
        .token-info { text-align: left; background: #111; padding: 15px; border-radius: 10px; margin-top: 10px; font-size: 0.85rem; }
        .token-info span { color: var(--accent-color); font-family: monospace; word-break: break-all; }
        .social-links a { color: white; font-size: 1.8rem; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="logo-container">
            <img src="https://i.ibb.co/cKQrJBW1/7a2c60c6adc0c73f125c86674fddbc42.jpg" alt="KICKG">
        </div>
        <h1>KICKG ($AKSG) - نظام المكافآت</h1>
        <p>متوافق مع جميع المتصفحات (Brave, Edge, MetaMask, Trust)</p>
    </header>

    <div class="grid-layout">
        <div class="left-col">
            <div class="section">
                <h3><i class="fas fa-chart-line"></i> Live Chart ($AKSG)</h3>
                <div id="chart-container">
                    <iframe src="https://dexscreener.com/polygon/0xa8a79e754308d00690a75d264a7c3ba07bbf2a76?embed=1&theme=dark&trades=0&info=0"></iframe>
                </div>
            </div>
            <div class="section">
                <h3><i class="fas fa-info-circle"></i> إضافة العملة لمحفظتك</h3>
                <div class="token-info">
                    العقد (Polygon): <br>
                    <span>0x58F821f9bDa7Af97c76725A1aBACD3EC61042a4D</span>
                </div>
            </div>
        </div>

        <div class="right-col">
            <div class="section">
                <h3><i class="fas fa-shield-alt"></i> التحقق</h3>
                <div class="warning-box">
                    <i class="fas fa-exclamation-triangle"></i>
                    <span>ملاحظة لمستخدمي <b>Brave</b>: يرجى التأكد من تعطيل "Shields" إذا واجهت مشكلة في الربط.</span>
                </div>

                <div id="kickStep">
                    <button class="btn-web3 btn-kick" id="kickAction"><i class="fab fa-kickstarter"></i> 1. متابعة GHOST_GAMINGTV</button>
                    <div id="timerBox" style="display:none; margin-top:10px; color:var(--kick-green);">انتظر <span id="seconds">5</span> ثوانٍ...</div>
                </div>

                <div id="confirmStep">
                    <button class="btn-web3" id="confirmAction" style="background: #333;">2. أكدت المتابعة ✅</button>
                </div>

                <div id="walletStep">
                    <button class="btn-web3" id="connectWallet"><i class="fas fa-wallet"></i> 3. ربط المحفظة وتوقيع العقد</button>
                </div>

                <div id="claimStep">
                    <button class="btn-web3" id="claimAction" style="background: linear-gradient(90deg, #ff00cc, #3333ff);">استلام المكافأة (CLAIM)</button>
                </div>
            </div>

            <div class="section social-links">
                <a href="https://kick.com/ghost_gamingtv" target="_blank"><i class="fab fa-kickstarter"></i></a>
                <a href="https://x.com/tv_ghostgaming" target="_blank"><i class="fab fa-twitter"></i></a>
                <a href="https://t.me/ghost_gamingtv" target="_blank"><i class="fab fa-telegram"></i></a>
            </div>
        </div>
    </div>
</div>

<script>
    const CONFIG = {
        KICK_URL: "https://kick.com/ghost_gamingtv",
        THIRDWEB_ID: "5ed0be08816a9f32809c6e550046bf03",
        CONTRACT: "0x58F821f9bDa7Af97c76725A1aBACD3EC61042a4D",
        NETWORK: "polygon"
    };

    // 1. منطق كيك والعداد
    document.getElementById("kickAction").onclick = function() {
        window.open(CONFIG.KICK_URL, "_blank");
        this.disabled = true;
        document.getElementById("timerBox").style.display = "block";
        let timeLeft = 5;
        const timer = setInterval(() => {
            timeLeft--;
            document.getElementById("seconds").innerText = timeLeft;
            if (timeLeft <= 0) {
                clearInterval(timer);
                document.getElementById("kickStep").style.display = "none";
                document.getElementById("confirmStep").style.display = "block";
            }
        }, 1000);
    };

    document.getElementById("confirmAction").onclick = function() {
        document.getElementById("confirmStep").style.display = "none";
        document.getElementById("walletStep").style.display = "block";
    };

    // 2. منطق ربط المحفظة المحسن لـ Brave و Edge
    document.getElementById("connectWallet").onclick = async () => {
        // البحث عن أي محفظة متاحة (MetaMask, Brave, Edge Wallet, Trust)
        const provider = window.ethereum || (window.web3 && window.web3.currentProvider);
        
        if (provider) {
            try {
                const web3Provider = new ethers.providers.Web3Provider(provider);
                await web3Provider.send("eth_requestAccounts", []);
                const signer = web3Provider.getSigner();
                const address = await signer.getAddress();
                
                // طلب التوقيع لتعزيز الأمان
                const msg = `تأكيد ربط المحفظة لمشروع KICKGHOST\nالمحفظة: ${address}`;
                await signer.signMessage(msg);

                document.getElementById("connectWallet").innerText = "تم الربط والتوثيق ✅";
                document.getElementById("connectWallet").disabled = true;
                document.getElementById("claimStep").style.display = "block";
            } catch (err) {
                alert("تم إلغاء العملية أو المتصفح حظر الطلب.");
            }
        } else {
            alert("لم يتم العثور على محفظة. إذا كنت تستخدم Brave أو Edge، تأكد من تفعيل المحفظة المدمجة أو إضافة MetaMask.");
        }
    };

    // 3. منطق الـ Claim
    document.getElementById("claimAction").onclick = async () => {
        try {
            document.getElementById("claimAction").innerText = "جاري المعالجة... ⏳";
            const sdk = new window.ThirdwebSDK(CONFIG.NETWORK, { clientId: CONFIG.THIRDWEB_ID });
            const contract = await sdk.getContract(CONFIG.CONTRACT);
            await contract.erc20.claim(1); 
            alert("نجحت العملية! راجع محفظتك.");
            document.getElementById("claimAction").innerText = "تم الاستلام ✅";
        } catch (err) {
            alert("فشل الكليم. تأكد من وجود MATIC للرسوم.");
            document.getElementById("claimAction").innerText = "حاول مجدداً";
        }
    };
</script>
</body>
</html>
